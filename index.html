<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estudio Musical</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <span class="app-name">Estudio Musical</span>
    <button id="open-btn">Abrir partitura</button>
    <input id="file-input" type="file" accept=".pdf,image/jpeg,image/png,image/webp" multiple hidden />
    <button id="autoscroll-btn">Auto-scroll</button>
    <label for="speed-input" class="speed-label">Velocidad</label>
    <input id="speed-input" type="range" min="1" max="10" value="3" aria-label="Velocidad de desplazamiento" title="Velocidad de desplazamiento" />
  </header>

  <main id="viewer">
    <div id="empty-state">
      <p>Abre un archivo PDF para comenzar a leer tu partitura.</p>
    </div>
  </main>

  <script src="lib/pdf.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
