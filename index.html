<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estudio Musical</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <span class="app-name">Estudio Musical</span>
    <button id="library-btn" aria-haspopup="dialog">Biblioteca</button>
    <button id="autoscroll-btn" aria-pressed="false">Auto-scroll</button>
    <label for="speed-input" class="speed-label">Velocidad</label>
    <input id="speed-input" type="range" min="0.2" max="10" step="0.2" value="3" aria-label="Velocidad de desplazamiento" title="Velocidad de desplazamiento" />
    <button id="metronome-btn" aria-pressed="false">Metrónomo</button>
    <label for="bpm-input" class="metronome-label">BPM</label>
    <input id="bpm-input" type="number" min="40" max="240" value="120" aria-label="Tempo en BPM" title="Tempo en BPM" />
    <label for="time-signature-select" class="metronome-label">Compás</label>
    <select id="time-signature-select" aria-label="Compás del metrónomo" title="Compás del metrónomo">
      <option value="2/4">2/4</option>
      <option value="3/4">3/4</option>
      <option value="4/4" selected>4/4</option>
      <option value="6/8">6/8</option>
    </select>
  </header>

  <main id="viewer">
    <div id="empty-state">
      <p>Abre o selecciona una partitura (PDF o imágenes) o desde tu biblioteca para comenzar.</p>
    </div>
  </main>

  <dialog id="library-dialog" class="library-dialog" aria-labelledby="library-dialog-title">
    <div class="library-header">
      <h2 id="library-dialog-title">Biblioteca</h2>
      <button id="close-library-btn" type="button" aria-label="Cerrar biblioteca">✕</button>
    </div>
    <div class="library-actions">
      <button id="open-btn" type="button" class="library-open-btn">Abrir partitura</button>
      <input id="file-input" type="file" accept=".pdf,image/jpeg,image/png,image/webp" multiple hidden />
    </div>
    <div id="library-empty" class="library-empty" hidden>
      <p>No tienes partituras guardadas.</p>
    </div>
    <ul id="library-list" class="library-list"></ul>
  </dialog>

  <script src="lib/pdf.min.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>

</html>
